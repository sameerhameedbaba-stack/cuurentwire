name: URL survival probe

# Audit invariant: once a /story/ URL is published, it never becomes
# unknown. Daily: pick up newly advertised URLs, re-check the entire
# ledger, fail on any dead URL, and commit the updated ledger.
#
# On failure it opens/updates ONE "[auto-alert]" issue — issue creation
# emails the repo owner, and a plain red workflow run proved too quiet
# during the 2026-08 outages — and comments + closes it on the next green
# run, mirroring .github/workflows/uptime.yml. The probe itself is unchanged.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # re-enable sibling scheduled workflows below
  issues: write # open/close the [auto-alert] issue below

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run survival probe
        id: probe
        # The probe's output is teed into a log so the alert issue can quote
        # its tail (which URLs died) instead of only linking the run.
        # pipefail keeps the probe's own exit code through the tee.
        run: |
          set -o pipefail
          status=0
          node scripts/url-survival.mjs 2>&1 | tee probe.log || status=$?
          {
            echo "details<<DETAILS_EOF"
            tail -n 60 probe.log
            echo "DETAILS_EOF"
          } >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Open or update the alert issue
        if: failure()
        uses: actions/github-script@v7
        env:
          DETAILS: ${{ steps.probe.outputs.details }}
        with:
          script: |
            const title = "[auto-alert] published story URLs are failing the survival check";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The daily URL survival probe failed — a published /story/ URL no longer resolves, or the origin is down.`,
              "```",
              process.env.DETAILS || "(no details captured)",
              "```",
              `Run: ${runUrl}`,
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: `Still failing.\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
      - name: Close the alert issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[auto-alert] published story URLs are failing the survival check";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: "Recovered — every ledger URL resolves again. Closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: "closed",
              });
            }
      - name: Commit updated ledger
        if: always()
        run: |
          git config user.name "url-survival-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/url-ledger.json
          git diff --cached --quiet || git commit -m "chore: url survival ledger $(date -u +%F)"
          # A bare `git push` loses to any concurrent write to main and throws
          # away a measurement that took 16 minutes of probing to produce — and
          # then reports the whole run as failed, so the check looks broken
          # while it is actually passing. Measured cost: data/url-ledger.json
          # went 32 h without an update while every daily run "failed"
          # (2026-09-02 -> 09-04). gsc.yml and cwv.yml were fixed for this on
          # 2026-08-31; these two workflows, which are the ones that actually
          # collide at 06:17/06:47, were not. Rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = "5" ]; then
              echo "::error::push rejected 5 times; the survival ledger is measured but unsaved"
              exit 1
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((RANDOM % 5 + 3))
          done
      - name: Re-enable every scheduled workflow
        # GitHub auto-disables scheduled workflows on public repos after 60
        # days of repository inactivity. This workflow commits daily, so it
        # runs as long as anything does — have it re-arm the others so none can
        # stop silently. Best-effort by design.
        #
        # Fixed 2026-09-04: the list covered 3 of the 9 workflows, leaving
        # uptime (the outage detector), gsc, bluesky-post, deploy-watch and
        # this workflow itself unprotected — and if THIS one were ever
        # disabled the whole mechanism died with it. surface-coherence.yml now
        # carries the same step, so the two re-arm each other and no single
        # disable can take the guard down.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in surface-coherence seo-health cwv uptime gsc bluesky-post deploy-watch url-survival; do
            gh workflow enable "$wf.yml" || true
          done
