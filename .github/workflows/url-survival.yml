name: URL survival probe

# Audit invariant: once a /story/ URL is published, it never becomes
# unknown. Daily: pick up newly advertised URLs, re-check the entire
# ledger, fail on any dead URL, and commit the updated ledger.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # re-enable sibling scheduled workflows below

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run survival probe
        run: node scripts/url-survival.mjs
      - name: Commit updated ledger
        if: always()
        run: |
          git config user.name "url-survival-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/url-ledger.json
          git diff --cached --quiet || git commit -m "chore: url survival ledger $(date -u +%F)"
          git push
      - name: Re-enable sibling scheduled workflows
        # GitHub auto-disables scheduled workflows on public repos after 60
        # days of repository inactivity. This workflow commits daily, so it
        # runs as long as anything does — have it re-arm the other probes so
        # none of them can stop silently. Best-effort by design.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable surface-coherence.yml || true
          gh workflow enable seo-health.yml || true
