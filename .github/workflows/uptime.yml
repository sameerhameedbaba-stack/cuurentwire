name: Uptime probe

# Is production actually up AND serving real, fresh news?
#
# CADENCE, MEASURED — read this before trusting any detection-time claim.
# This asked for */30 and GitHub delivered one run every 3.62 h: 59 scheduled
# runs over 210.1 h (13.8% of nominal), with observed gaps of 12.50, 10.55 and
# 9.69 hours. GitHub documents scheduled runs as best-effort and drops them
# under load, worst at the top of the hour; */30 on a public repo is a request,
# not a promise, and the header used to state it as one. Asking hourly at an
# odd minute is delivered far more reliably than */30 at :00 and :30, so that
# is what it now asks for — fewer requested runs, more actual ones.
#
# What that means for the thresholds below, honestly: they are correct as
# STALENESS limits (45 min of dataset age really is three missed refreshes)
# but they are NOT detection-time guarantees. A fault that self-heals inside
# one gap is missed entirely. This probe is a safety net for sustained
# breakage, not a minute-resolution monitor, and nothing here should be quoted
# as "we detect outages within 30 minutes".
# "Fresh" means two independent things and both are checked: the dataset the
# pages render from (the cw-dataset-version stamp) and the permanent archive
# behind it (the newest news-sitemap publication_date). 2026-08-26 proved
# they can diverge — a fresh dataset served over a write path that had been
# dead for 14 hours.
# Probes the homepage, the archive sitemap (the surface that exposed the
# 2026-08-19 Neon outage), the news sitemap and /briefing for HTTP 200, then
# checks the homepage content itself: no demo-mode banner, a dataset version
# stamped within the last 45 minutes (three missed 15-minute refreshes), and
# a news sitemap that still lists at least 50 stories. A site can answer 200
# on every URL while showing mock data or a day-old dataset — the 2026-08
# outages were exactly that kind of quiet failure.
#
# On failure it opens ONE "[auto-alert]" GitHub issue — issue creation
# emails the repo owner, which is the delivery channel the daily 06:47
# checks lacked (three outages were detected but nobody was told for
# hours). On recovery it comments and closes the issue, so an open
# auto-alert issue always means "broken right now". $0, no external
# services, and nothing but bash + curl + grep/sed/date so the probe itself
# can never be broken by a dependency install.

on:
  schedule:
    # Hourly at :17 — deliberately off the top of the hour, where GitHub sheds
    # the most scheduled load. See the measured-cadence note in the header:
    # this is a request GitHub may still drop, not a guarantee.
    - cron: "17 * * * *"
  workflow_dispatch:
  # On-demand independent probe: change .github/triggers/uptime (a timestamp
  # line) and push. Added 2026-09-02, when the daily loop's own verification
  # polling tripped Vercel's bot mitigation and every surface — including
  # robots.txt and all three sitemaps — answered 403
  # `X-Vercel-Mitigated: challenge` from this machine's IP. That is
  # indistinguishable from an outage when you only have one vantage point,
  # and the standing alerting rule makes an outage the run's only priority,
  # so guessing wrong is expensive in both directions. This workflow probes
  # from GitHub's IPs, which is exactly the second opinion that was missing;
  # the schedule fires irregularly (21:34, 18:42, 15:03, 10:21 on 2026-09-01),
  # so waiting for the next one is not an answer.
  # .github is excluded from vercel.json's ignoreCommand, so this never
  # triggers a deploy.
  push:
    paths:
      - ".github/triggers/uptime"

permissions:
  issues: write
  actions: write # re-enable sibling scheduled workflows (last step)

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production
        id: probe
        # Every check appends one line to the `details` output so the alert
        # issue body says exactly which check failed, not just "red".
        #
        # REWRITTEN 2026-09-28 for the static site on GitHub Pages. The old
        # probe checked the aggregator's internals — /briefing, the news and
        # archive sitemaps, a 45-minute dataset stamp, archive write bursts —
        # none of which exist any more. Left as they were, every check would
        # fail forever and the alert issue could never mean "broken right
        # now" again. What healthy means for the static site:
        #   1. the pages and machine-read files answer 200 over HTTPS (curl
        #      fails on an invalid certificate, which is the failure mode of a
        #      custom domain whose Pages certificate lapsed);
        #   2. it is OUR static site being served (a marker on the home page),
        #      with no demo banner;
        #   3. the sitemap lists at least one article;
        #   4. the write path is alive: the newest article is under 7 days
        #      old. This is the static site's equivalent of the old archive
        #      write-freshness check. A news site with nothing new in a week
        #      has a broken or switched-off publishing routine — a decision
        #      only the owner can make, so it belongs in an alert.
        run: |
          fail=0
          # curl -w prints "000" itself on a transport error, so the fallback
          # is `|| true` (bash runs with -e in Actions), not `|| echo 000`,
          # which appended a second "000" and logged "HTTP 000000".
          home_html=$(mktemp)
          sitemap_xml=$(mktemp)
          rss_xml=$(mktemp)
          {
            echo "details<<DETAILS_EOF"

            # 1. Status codes.
            for url in "https://currentwire.us/" "https://currentwire.us/articles" "https://currentwire.us/sitemap.xml" "https://currentwire.us/robots.txt" "https://currentwire.us/rss.xml" "https://currentwire.us/llms.txt"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || true)
              echo "$url -> HTTP $code"
              case "$code" in
                200) ;;
                *) fail=1 ;;
              esac
            done

            # 2. It is our static site, and not showing demo data.
            home_code=$(curl -s -o "$home_html" -w "%{http_code}" --max-time 30 "https://currentwire.us/" || true)
            if [ "$home_code" != "200" ]; then
              echo "homepage content checks -> SKIPPED (homepage fetch returned HTTP $home_code)"
              fail=1
            else
              if grep -qF 'name="cw-site" content="static"' "$home_html"; then
                echo "static-site marker -> present (ok)"
              else
                echo "static-site marker -> MISSING (currentwire.us is not serving the GitHub Pages build)"
                fail=1
              fi
              if grep -qF 'Demo data notice' "$home_html"; then
                echo "demo-mode marker -> PRESENT (the live site is announcing fictional outlets)"
                fail=1
              else
                echo "demo-mode marker -> absent (ok)"
              fi
            fi

            # 3. The sitemap lists articles.
            sm_code=$(curl -s -o "$sitemap_xml" -w "%{http_code}" --max-time 30 "https://currentwire.us/sitemap.xml" || true)
            article_count=$(grep -o '<loc>[^<]*/article/[^<]*</loc>' "$sitemap_xml" | wc -l || true)
            article_count=$((article_count + 0))
            if [ "$sm_code" != "200" ] || [ "$article_count" -lt 1 ]; then
              echo "sitemap -> HTTP $sm_code with $article_count article URL(s) (minimum 1)"
              fail=1
            else
              echo "sitemap -> $article_count article URL(s) (ok)"
            fi

            # 4. The write path. rss.xml's lastBuildDate is the newest
            #    article's date, never the build clock (lib/editorial/feed.ts),
            #    so a rebuild with nothing new cannot fake freshness.
            rss_code=$(curl -s -o "$rss_xml" -w "%{http_code}" --max-time 30 "https://currentwire.us/rss.xml" || true)
            newest=$(grep -o '<lastBuildDate>[^<]*' "$rss_xml" | sed 's/.*>//' | head -n 1)
            if [ "$rss_code" != "200" ] || [ -z "$newest" ]; then
              echo "newest article -> unknown (rss.xml HTTP $rss_code, lastBuildDate '${newest:-none}')"
              fail=1
            else
              newest_s=$(date -u -d "$newest" +%s || echo 0)
              age_h=$(( ($(date -u +%s) - newest_s) / 3600 ))
              if [ "$newest_s" -eq 0 ]; then
                echo "newest article -> unparseable lastBuildDate '$newest'"
                fail=1
              elif [ "$age_h" -gt 168 ]; then
                echo "newest article -> $newest (${age_h} h ago, limit 168 h) — nothing published for a week; is the publishing routine running?"
                fail=1
              else
                echo "newest article -> $newest (${age_h} h ago, ok)"
              fi
            fi

            echo "DETAILS_EOF"
          } >> "$GITHUB_OUTPUT"
          exit "$fail"
      - name: Open or update the alert issue
        if: failure()
        uses: actions/github-script@v7
        env:
          DETAILS: ${{ steps.probe.outputs.details }}
        with:
          script: |
            const title = "[auto-alert] currentwire.us is failing its uptime probe";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The hourly uptime probe failed.`,
              "```",
              process.env.DETAILS || "(no details captured)",
              "```",
              `Run: ${runUrl}`,
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: `Still failing.\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
      - name: Close the alert issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[auto-alert] currentwire.us is failing its uptime probe";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: "Recovered — every probed URL answers 200 over HTTPS, currentwire.us is serving the static site with no demo banner, the sitemap lists articles and the newest article is under a week old. Closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: "closed",
              });
            }
      - name: Re-enable every scheduled workflow
        # GitHub auto-disables scheduled workflows on public repos after 60
        # days of repository inactivity. This step re-arms every scheduled
        # workflow on each run. It moved here from url-survival.yml and
        # surface-coherence.yml on 2026-09-28, when those two were retired
        # with the aggregator: uptime.yml and seo-health.yml now carry the
        # same step, so the two re-arm each other and no single disable can
        # take the guard down. tests/unit/gsc-crawl-freshness.test.ts fails if
        # a scheduled workflow is missing from either list. Best-effort.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in bluesky-post cwv gsc gsc-crawl-freshness pages seo-health uptime; do
            gh workflow enable "$wf.yml" || true
          done
