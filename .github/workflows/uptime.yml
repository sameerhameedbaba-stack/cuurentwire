name: Uptime probe

# Every 30 minutes: is production actually up AND serving real, fresh news?
# "Fresh" means two independent things and both are checked: the dataset the
# pages render from (the cw-dataset-version stamp) and the permanent archive
# behind it (the newest news-sitemap publication_date). 2026-08-26 proved
# they can diverge — a fresh dataset served over a write path that had been
# dead for 14 hours.
# Probes the homepage, the archive sitemap (the surface that exposed the
# 2026-08-19 Neon outage), the news sitemap and /briefing for HTTP 200, then
# checks the homepage content itself: no demo-mode banner, a dataset version
# stamped within the last 45 minutes (three missed 15-minute refreshes), and
# a news sitemap that still lists at least 50 stories. A site can answer 200
# on every URL while showing mock data or a day-old dataset — the 2026-08
# outages were exactly that kind of quiet failure.
#
# On failure it opens ONE "[auto-alert]" GitHub issue — issue creation
# emails the repo owner, which is the delivery channel the daily 06:47
# checks lacked (three outages were detected but nobody was told for
# hours). On recovery it comments and closes the issue, so an open
# auto-alert issue always means "broken right now". $0, no external
# services, and nothing but bash + curl + grep/sed/date so the probe itself
# can never be broken by a dependency install.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production
        id: probe
        # Every check appends one line to the `details` output so the alert
        # issue body says exactly which check failed, not just "red".
        run: |
          fail=0
          home_html=$(mktemp)
          news_xml=$(mktemp)
          {
            echo "details<<DETAILS_EOF"

            # 1. Status codes. /briefing is the Daily News Briefing page
            #    (shipped 2026-08-21) — it renders from the same dataset plus
            #    the database, so a non-200 there is a real outage.
            for url in "https://currentwire.us/" "https://currentwire.us/archive-sitemap.xml" "https://currentwire.us/news-sitemap.xml" "https://currentwire.us/briefing"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo 000)
              echo "$url -> HTTP $code"
              case "$code" in
                200) ;;
                *) fail=1 ;;
              esac
            done

            # 2. Homepage content — one fetch, two checks.
            home_code=$(curl -s -o "$home_html" -w "%{http_code}" --max-time 30 "https://currentwire.us/" || echo 000)
            if [ "$home_code" != "200" ]; then
              echo "homepage content checks -> SKIPPED (homepage fetch returned HTTP $home_code)"
              fail=1
            else
              # (a) Demo mode. components/layout/DemoBanner.tsx renders
              #     aria-label="Demo data notice" whenever the data mode is
              #     "mock". That attribute is the most stable marker: the
              #     visible copy is only uppercased by CSS and contains an em
              #     dash. Mock data in production means the real provider is
              #     down or misconfigured — invisible to a plain 200 check.
              if grep -qF 'Demo data notice' "$home_html"; then
                echo "demo-mode marker -> PRESENT (production is serving mock data)"
                fail=1
              else
                echo "demo-mode marker -> absent (ok)"
              fi

              # (b) Dataset freshness. Every list surface stamps
              #     <meta name="cw-dataset-version" content="YYYYMMDDTHHMMSSZ-hash">.
              #     The refresh cron runs every 15 minutes, so a stamp older
              #     than 45 minutes means three consecutive refreshes were
              #     missed (cron dead, provider quota exhausted, dataset not
              #     writing) while every page still returns 200.
              version=$(grep -o '<meta[^>]*name="cw-dataset-version"[^>]*>' "$home_html" | head -n 1 | sed -n 's/.*content="\([^"]*\)".*/\1/p' || true)
              stamp=$(printf '%s' "$version" | sed -n 's/^\([0-9]\{4\}\)\([0-9]\{2\}\)\([0-9]\{2\}\)T\([0-9]\{2\}\)\([0-9]\{2\}\)\([0-9]\{2\}\)Z.*/\1-\2-\3 \4:\5:\6/p' || true)
              if [ -z "$stamp" ]; then
                echo "dataset version -> MISSING or unparseable (meta content: '${version:-none}')"
                fail=1
              else
                now_s=$(date -u +%s)
                then_s=$(date -u -d "$stamp UTC" +%s || echo 0)
                age_min=$(( (now_s - then_s) / 60 ))
                if [ "$age_min" -gt 45 ]; then
                  echo "dataset version -> $version is ${age_min} min old (limit 45 min = three missed 15-min refreshes)"
                  fail=1
                else
                  echo "dataset version -> $version (${age_min} min old, ok)"
                fi
              fi
            fi

            # 3. The news sitemap must actually list stories. ~755 clusters per
            #    refresh is normal; fewer than 50 means an empty dataset or a
            #    sitemap route rendering from an empty fallback.
            news_code=$(curl -s -o "$news_xml" -w "%{http_code}" --max-time 30 "https://currentwire.us/news-sitemap.xml" || echo 000)
            news_count=$(grep -o '<url>' "$news_xml" | wc -l || true)
            news_count=$((news_count + 0))
            if [ "$news_code" != "200" ] || [ "$news_count" -lt 50 ]; then
              echo "news sitemap -> HTTP $news_code with $news_count <url> entries (minimum 50)"
              fail=1
            else
              echo "news sitemap -> $news_count <url> entries (ok)"
            fi

            # 4. Archive write stall. Each entry's <news:publication_date> is
            #    the archive's first_seen_at, and the sitemap lists only
            #    clusters the archive already holds, so the NEWEST date is a
            #    direct read of the last successful database write burst
            #    (persist-gate.ts caps that gap at ~30 min). On 2026-08-26
            #    the bursts stopped at 07:31 UTC and nothing noticed for 14
            #    hours: every URL answered 200, the dataset stayed fresh, the
            #    checks above all passed — while every story published in
            #    that window got no permanent row (the same mechanism that
            #    lost 205 stories in the 2026-08-20 outage) and the feed
            #    Google News reads shrank from 643 entries to 132. Four
            #    hours is eight missed bursts. Reuses the sitemap already
            #    fetched above: no extra request, no database read.
            if [ "$news_code" = "200" ]; then
              newest=$(grep -o '<news:publication_date>[^<]*' "$news_xml" | sed 's/.*>//' | sort | tail -n 1)
              if [ -z "$newest" ]; then
                echo "archive write freshness -> no publication_date found in the news sitemap"
                fail=1
              else
                newest_s=$(date -u -d "$newest" +%s || echo 0)
                age_min=$(( ($(date -u +%s) - newest_s) / 60 ))
                if [ "$newest_s" -eq 0 ]; then
                  echo "archive write freshness -> unparseable publication_date '$newest'"
                  fail=1
                elif [ "$age_min" -gt 240 ]; then
                  echo "archive write freshness -> newest story archived $newest (${age_min} min ago, limit 240) — the persist burst has stopped; new stories have no permanent row"
                  fail=1
                else
                  echo "archive write freshness -> newest story archived ${age_min} min ago (ok)"
                fi
              fi
            fi

            echo "DETAILS_EOF"
          } >> "$GITHUB_OUTPUT"
          exit "$fail"
      - name: Open or update the alert issue
        if: failure()
        uses: actions/github-script@v7
        env:
          DETAILS: ${{ steps.probe.outputs.details }}
        with:
          script: |
            const title = "[auto-alert] currentwire.us is failing its uptime probe";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The 30-minute uptime probe failed.`,
              "```",
              process.env.DETAILS || "(no details captured)",
              "```",
              `Run: ${runUrl}`,
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: `Still failing.\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
      - name: Close the alert issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[auto-alert] currentwire.us is failing its uptime probe";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: "Recovered — every probed URL answers 200, no demo-mode banner, the dataset version is fresh, the news sitemap is populated and the archive is taking writes again. Closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: "closed",
              });
            }
