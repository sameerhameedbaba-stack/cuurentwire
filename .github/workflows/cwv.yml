name: Core Web Vitals check

# Weekly Core Web Vitals measurement (seo/BACKLOG.md item 19).
#
# Keyless by default: scripts/cwv-check.mjs drives the Chromium that
# Playwright already installs, under Lighthouse's mobile throttling, and
# reads LCP/CLS/FCP/TTFB from the browser's own PerformanceObserver. No API
# key, no signup, no quota, $0 — so this workflow produces real data without
# anything from the owner.
#
# If a PSI_API_KEY repo secret ever exists, the same script switches to
# PageSpeed Insights instead, which adds CrUX field data on top. That needs
# real traffic volume the site does not have yet, which is why the keyless
# path is the default rather than a fallback.
#
# The same weekly run also audits Discover image eligibility
# (scripts/image-eligibility.mjs): og:image width, pixel count and aspect
# ratio sampled from the newest news-sitemap stories. Both results are
# committed to data/ as dated history.

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cwv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        # Only the browser the probe drives — --with-deps pulls the system
        # libraries headless Chromium needs on a bare runner.
        run: npx playwright install chromium --with-deps
      - name: Run CWV check
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: node scripts/cwv-check.mjs
      - name: Run image eligibility audit
        # Measurement only: the script exits 0 on every per-URL failure and
        # only fails when the news sitemap itself cannot be fetched. It is
        # independent of the CWV step, so it still runs when that one failed.
        if: always()
        run: node scripts/image-eligibility.mjs
      - name: Commit updated history
        if: always()
        run: |
          git config user.name "cwv-bot"
          git config user.email "actions@users.noreply.github.com"
          # Add each file only if its step produced it: git add on a missing
          # path is a hard error, and either step can fail before writing
          # while the other succeeds.
          for f in data/cwv-history.json data/image-eligibility*.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -m "chore: cwv history + image eligibility $(date -u +%F)"
          git push
