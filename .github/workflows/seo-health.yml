name: SEO health check

# Daily deterministic SEO regression check against production. Fails loudly
# on any regression: broken sitemaps, stale news-sitemap, missing
# feeds/llms.txt/IndexNow key, invalid story JSON-LD, soft-404s, lost
# redirects. On failure it also opens/updates an "[auto-alert]" issue so the
# owner gets an email — plain workflow-failure emails proved too quiet
# during the 2026-08 outages, and closes it again on the next green run.
# (Until 2026-08-27 this workflow only OPENED: issue #5 was still standing
# open hours after the run that would have closed it passed, so an open
# alert stopped meaning "broken right now" — the one thing it must mean.)
# $0 — no keys, no external services.

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write # re-enable sibling scheduled workflows (last step)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The static site (GitHub Pages, production since 2026-09-28). The old
      # scripts/seo-health.mjs checks the aggregator's surfaces — news and
      # archive sitemaps, /api/stats, per-section feeds, /top-100 — which the
      # static site does not have, so it would fail every day and the alert
      # would stop meaning anything. It is kept for the dormant Vercel app.
      - name: Run SEO health check
        run: node scripts/seo-health-static.mjs
      - name: Open or update the alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[auto-alert] daily SEO health check failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The daily SEO health check failed. Log: ${runUrl}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: `Still failing.\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
      - name: Close the alert issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[auto-alert] daily SEO health check failing";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recovered — every SEO health check passed. Log: ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: "closed",
              });
            }
      - name: Re-enable every scheduled workflow
        # GitHub auto-disables scheduled workflows on public repos after 60
        # days of repository inactivity. This step re-arms every scheduled
        # workflow on each run. It moved here from url-survival.yml and
        # surface-coherence.yml on 2026-09-28, when those two were retired
        # with the aggregator: uptime.yml and seo-health.yml now carry the
        # same step, so the two re-arm each other and no single disable can
        # take the guard down. tests/unit/gsc-crawl-freshness.test.ts fails if
        # a scheduled workflow is missing from either list. Best-effort.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in bluesky-post cwv gsc gsc-crawl-freshness seo-health uptime; do
            gh workflow enable "$wf.yml" || true
          done
