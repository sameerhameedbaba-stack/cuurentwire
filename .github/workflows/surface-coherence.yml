name: Surface coherence probe

# Audit invariant (round 7, P0 #1): every public surface rendering the
# same story under the same dataset version must agree on category,
# country and source count. Daily: probe the list surfaces and every
# collected story page twice ~30s apart, fail on any same-version
# disagreement, archive-vs-live split, category flap or extraction
# blindness, and commit the report.
#
# On failure it opens/updates ONE "[auto-alert]" issue — issue creation
# emails the repo owner, and a plain red workflow run proved too quiet
# during the 2026-08 outages — and comments + closes it on the next green
# run, mirroring .github/workflows/uptime.yml. The probe itself is unchanged.

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write # open/close the [auto-alert] issue below

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run coherence probe
        id: probe
        env:
          BASE_URL: https://currentwire.us
        # The probe's output is teed into a log so the alert issue can quote
        # its tail (which surfaces disagreed) instead of only linking the
        # run. pipefail keeps the probe's own exit code through the tee.
        run: |
          set -o pipefail
          status=0
          npm run coherence:check 2>&1 | tee probe.log || status=$?
          {
            echo "details<<DETAILS_EOF"
            tail -n 60 probe.log
            echo "DETAILS_EOF"
          } >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Open or update the alert issue
        if: failure()
        uses: actions/github-script@v7
        env:
          DETAILS: ${{ steps.probe.outputs.details }}
        with:
          script: |
            const title = "[auto-alert] public surfaces disagree (coherence probe failed)";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The daily surface coherence probe failed — two public surfaces showed the same story differently under one dataset version, or a surface could not be read.`,
              "```",
              process.env.DETAILS || "(no details captured)",
              "```",
              `Run: ${runUrl}`,
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: `Still failing.\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
      - name: Close the alert issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[auto-alert] public surfaces disagree (coherence probe failed)";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: "Recovered — the coherence probe passed; every surface agrees again. Closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: "closed",
              });
            }
      - name: Commit updated report
        if: always()
        run: |
          git config user.name "surface-coherence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/coherence-report.json
          git diff --cached --quiet || git commit -m "chore: surface coherence report $(date -u +%F)"
          # Same lost-push race as url-survival.yml (both run ~06:17-06:47 and
          # both push to main); gsc.yml and cwv.yml already carry this loop.
          # A bare push discards the report AND fails the run, so the probe
          # reads as broken while it is passing.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = "5" ]; then
              echo "::error::push rejected 5 times; the coherence report is measured but unsaved"
              exit 1
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((RANDOM % 5 + 3))
          done
      - name: Re-enable every scheduled workflow
        # The second half of the anti-auto-disable guard (the first is in
        # url-survival.yml). Two independent daily workflows re-arm the whole
        # set, including each other, so no single workflow being disabled can
        # take the mechanism down with it — which is exactly what the
        # single-workflow version risked until 2026-09-04.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in url-survival seo-health cwv uptime gsc bluesky-post deploy-watch surface-coherence; do
            gh workflow enable "$wf.yml" || true
          done
